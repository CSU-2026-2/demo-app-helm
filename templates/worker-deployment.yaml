apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo-worker.fullname" . }}
  labels:
    {{- include "demo-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "demo-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "demo-worker.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "demo-kafka.bootstrapServers" . | quote }}
            - name: KAFKA_TODO_TOPIC
              value: {{ .Values.kafka.topic | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: {{ .Values.secrets.database }}
            - name: YANDEX_CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  key: YANDEX_CLOUD_API_KEY
                  name: {{ .Values.secrets.yandex }}
            - name: YANDEX_CLOUD_FOLDER
              valueFrom:
                secretKeyRef:
                  key: YANDEX_CLOUD_FOLDER
                  name: {{ .Values.secrets.yandex }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

