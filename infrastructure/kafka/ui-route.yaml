apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafbat
  namespace: kafka
spec:
  hostnames:
    - kafka.kubepractice.ru
  parentRefs:
    - name: eg
      namespace: default
      sectionName: kafka-https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kafbat
          port: 80
