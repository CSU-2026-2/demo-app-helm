replicaCount: 1
app:
  image:
    repository: ghcr.io/csu-itmo-2025-2/demo-app
    pullPolicy: Always
    tag: "sha-c3e95ef"
worker:
  replicaCount: 1
  image:
    repository: ghcr.io/csu-itmo-2025-2/demo-worker
    pullPolicy: Always
    tag: "sha-5db561a"
kafka:
  bootstrapServers: my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
  topic: todos-created
secrets:
  database: db-credentials
  yandex: demo-openai-config
imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: demo.kubepractice.ru
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - demo.kubepractice.ru
      secretName: tls-secret
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
nodeSelector: {}
tolerations: []
affinity: {}
