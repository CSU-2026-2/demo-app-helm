  enabled: true
  hostname: demo.kubepractice.ru
  gateway:
    name: eg
    namespace: default
    httpsListener: demo-https
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
nodeSelector: {}
tolerations: []
affinity: {}
