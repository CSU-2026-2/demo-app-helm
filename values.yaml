replicaCount: 1
app:
  image:
    repository: ghcr.io/csu-2026-2/demo-app
    pullPolicy: Always
    tag: "sha-e18da9c"
worker:
  replicaCount: 1
  image:
    repository: ghcr.io/csu-2026-2/demo-worker
    pullPolicy: Always
    tag: "sha-961d82e"
kafka:
  bootstrapServers: "kafka.kafka.svc.cluster.local:9092"
  topic: todos-created
secrets:
  database: db-credentials
  yandex: demo-openai-config
  auth: demo-auth
